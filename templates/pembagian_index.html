<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Divisi - APBI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
          body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .sidebar {
            background-color: white;
            color: black;
            padding: 20px;
            max-width: 200px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-right: 1px solid #ddd;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
        }
        .sidebar img {
            display: block;
            margin: -15px auto 20px auto;
            height: 60px;
        }
        .sidebar .nav-link {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        .sidebar .nav-link span {
            display: inline-block;
            vertical-align: middle;
        }
        .sidebar .nav-link:hover {
            background-color: #007aff;
            color: white;
        }
        .navbar-custom {
            background-color: #007aff;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: white;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 200px;
            right: 0;
            z-index: 1000;
            height: 58px;
        }
        .content {
            padding: 20px;
            flex-grow: 1;
            margin-left: 200px;
            margin-top: 60px;
        }
        
        h1 {
            margin-bottom: 20px;
            font-weight: bold;
            color: #343a40;
        }
        .table-responsive {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        background-color: white;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 20px;
        background-color: white;
        font-family: "Roboto", sans-serif;
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #007aff;
        color: white;
        font-weight: 600;
        font-size: 15px;
        text-transform: uppercase;
        border-top: 1px solid #ddd;
    }

    td {
        font-size: 14px;
        color: #555;
    }

    tr:nth-child(even) {
        background-color: #f7f7f7;
    }

    tr:hover {
        background-color: #e9f3ff;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
        .btn-primary {
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 16px;
            margin-bottom: 20px;
            background-color: #007aff;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .table-container {
            margin: 0 auto;
            max-width: auto;
        }

        .action-buttons a {
            text-decoration: none;
            font-size: 14px;
            color: #007aff;
            margin-right: 10px;
            transition: color 0.3s;
        }

        .action-buttons form {
            display: inline;
        }

        .action-buttons button {
            border: none;
            background: none;
            color: #ff6b6b;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .action-buttons a:hover {
            color: #0056b3;
        }

        .action-buttons button:hover {
            color: #ff3333;
        }

    </style>
</head>
<body>
    <div class="d-flex">



        <div class="flex-grow-1">
            <nav class="navbar navbar-expand-lg navbar-custom">
                <div class="container-fluid">
                    <span>Sistem Absen</span>
                </div>
            </nav>

<div class="content">
    <h2 class="mb-4" style="font-weight: 700;">Daftar Fungsi</h2>

    <div class="d-flex justify-content-between mb-3">
        <a href="{{ url_for('create_pembagian2') }}" class="btn btn-primary" style="padding: 10px 20px; font-size: 16px; border-radius: 8px;">
            Tambah Baru
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover" style="background-color: white; border-radius: 10px; overflow: hidden;">
            <thead class="table" style="text-transform: uppercase; font-size: 14px;">
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 70%;">Nama</th>
                    <th style="width: 20%; text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for pembagian in pembagian2_data %}
                <tr>
                    <td>{{ pembagian.pembagian2_id }}</td>
                    <td>{{ pembagian.pembagian2_nama }}</td>
                    <td style="text-align: center;">
                        <div class="action-buttons d-flex justify-content-center">
                            <a href="{{ url_for('update_pembagian2', id=pembagian.pembagian2_id) }}" class="text-decoration-none me-2" style="color: #007aff;">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <form action="{{ url_for('delete_pembagian2', id=pembagian.pembagian2_id) }}" method="POST" onsubmit="return confirm('Apakah Anda yakin ingin menghapus data ini?');">
                                <button type="submit" class="btn btn-link p-0" style="color: #ff6b6b;">
                                    <i class="fas fa-trash-alt"></i> Hapus
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

            
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
