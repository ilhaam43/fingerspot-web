<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Converted Data DCAP</title>
    <style>
        table.dataframe {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1rem;
        }
        table.dataframe th, table.dataframe td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            text-align: left;
            font-size: 0.875rem;
        }
        table.dataframe th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        table.dataframe tr:nth-child(even) {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 mt-8">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Hasil Convert DCAP</h1>
                    <p class="text-gray-500 text-sm">Kolom terpilih dari file: {{ filename }}</p>
                </div>
                <div class="space-x-2">
                    <a href="{{ url_for('view_dcap', filename=filename) }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded shadow transition">
                        <i class="fas fa-arrow-left mr-2"></i>Kembali
                    </a>
                    <a href="{{ url_for('apply_rules_dcap', filename=filename) }}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded shadow transition">
                        <i class="fas fa-filter mr-2"></i>Apply Rules
                    </a>
                </div>
            </div>

            <div class="overflow-x-auto">
                <!-- HTML Table generated by Pandas -->
                {{ tables | safe }}
            </div>
        </div>
    </div>
</body>
</html>
