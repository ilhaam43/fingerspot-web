<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shift - APBI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
 body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .sidebar {
            background-color: white;
            color: black;
            padding: 20px;
            max-width: 200px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-right: 1px solid #ddd;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
        }
        .sidebar img {
            display: block;
            margin: -15px auto 20px auto;
            height: 60px;
        }
        .sidebar .nav-link {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        .sidebar .nav-link span {
            display: inline-block;
            vertical-align: middle;
        }
        .sidebar .nav-link:hover {
            background-color: #007aff;
            color: white;
        }
        .navbar-custom {
            background-color: #007aff;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: white;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 200px;
            right: 0;
            z-index: 1000;
            height: 58px;
        }
        .content {
            padding: 20px;
            flex-grow: 1;
            margin-left: 200px;
            margin-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
     <script>
        document.addEventListener('DOMContentLoaded', function() {
            let employeeData = {};
            let jamKerjaData = {};

            fetch('/get_employee_data')
                .then(response => response.json())
                .then(data => {
                    employeeData = data;
                });

            fetch('/get_jam_kerja_data')
                .then(response => response.json())
                .then(data => {
                    jamKerjaData = data;
                });

            fetch('/get_shift_mappings')
                .then(response => response.json())
                .then(data => {
                    const shiftSelect = document.getElementById('shift_name');
                    for (const shiftName in data) {
                        const option = document.createElement('option');
                        option.value = shiftName;
                        option.textContent = shiftName;
                        shiftSelect.appendChild(option);
                    }

                    shiftSelect.addEventListener('change', function() {
                        const selectedShift = shiftSelect.value;
                        const nipsContainer = document.getElementById('nips-container');
                        const shiftMappingContainer = document.getElementById('shift-mapping-container');

                        nipsContainer.innerHTML = '';
                        shiftMappingContainer.innerHTML = '';

                        if (selectedShift) {
                            const shiftData = data[selectedShift];
                            shiftData.nips.forEach(nip => {
                                const select = document.createElement('select');
                                select.classList.add('form-select', 'mb-3');
                                select.name = 'nips';
                                select.required = true;
                                for (const [nipKey, name] of Object.entries(employeeData)) {
                                    const option = document.createElement('option');
                                    option.value = nipKey;
                                    option.textContent = name;
                                    if (nipKey === nip) {
                                        option.selected = true;
                                    }
                                    select.appendChild(option);
                                }
                                nipsContainer.appendChild(select);
                            });

                            for (const [key, value] of Object.entries(shiftData.shift_mapping)) {
                                const keyInput = document.createElement('input');
                                keyInput.type = 'text';
                                keyInput.classList.add('form-control', 'mb-3');
                                keyInput.name = 'shift_mapping_keys';
                                keyInput.value = key;
                                keyInput.required = true;

                                const valueSelect = document.createElement('select');
                                valueSelect.classList.add('form-select', 'mb-3');
                                valueSelect.name = 'shift_mapping_values';
                                valueSelect.required = true;
                                for (const [jkId, jkName] of Object.entries(jamKerjaData)) {
                                    const option = document.createElement('option');
                                    option.value = jkId;
                                    option.textContent = jkName;
                                    if (jkId === value.toString()) {
                                        option.selected = true;
                                    }
                                    valueSelect.appendChild(option);
                                }
                                shiftMappingContainer.appendChild(keyInput);
                                shiftMappingContainer.appendChild(valueSelect);
                            }
                        }
                    });
                });
        });

        function addNipField() {
            fetch('/get_employee_data')
                .then(response => response.json())
                .then(data => {
                    const nipsContainer = document.getElementById('nips-container');
                    const select = document.createElement('select');
                    select.classList.add('form-select', 'mb-3');
                    select.name = 'nips';
                    select.required = true;
                    for (const [nip, name] of Object.entries(data)) {
                        const option = document.createElement('option');
                        option.value = nip;
                        option.textContent = name;
                        select.appendChild(option);
                    }
                    nipsContainer.appendChild(select);
                });
        }

        function addShiftMappingField() {
            fetch('/get_jam_kerja_data')
                .then(response => response.json())
                .then(data => {
                    const shiftMappingContainer = document.getElementById('shift-mapping-container');
                    const keyInput = document.createElement('input');
                    keyInput.type = 'text';
                    keyInput.classList.add('form-control', 'mb-3');
                    keyInput.name = 'shift_mapping_keys';
                    keyInput.required = true;

                    const valueSelect = document.createElement('select');
                    valueSelect.classList.add('form-select', 'mb-3');
                    valueSelect.name = 'shift_mapping_values';
                    valueSelect.required = true;
                    for (const [jkId, jkName] of Object.entries(data)) {
                        const option = document.createElement('option');
                        option.value = jkId;
                        option.textContent = jkName;
                        valueSelect.appendChild(option);
                    }
                    shiftMappingContainer.appendChild(keyInput);
                    shiftMappingContainer.appendChild(valueSelect);
                });
        }
    </script>
</head>
<body>
    <div class="d-flex">

        <div class="sidebar">
            <img src="https://www.lintasarta.net/storage/2024/06/Logo-Lintasarta-new.png" alt="Lintasarta Logo">
            <div class="menu">
                <a class="nav-link" href="/"><i class="fas fa-home"></i> <span>Beranda</span></a>
                <a class="nav-link" href="/upload_excel"><i class="fas fa-calendar-alt"></i> <span>Upload Jadwal Shift</span></a>
                <a class="nav-link" href="/upload"><i class="fas fa-database"></i> <span>Load Data Absen (Mesin Lama)</span></a>
                <a class="nav-link" href="/att_log"><i class="fas fa-fingerprint"></i> <span>Load Data Absen Fingerspot</span></a>
                <a class="nav-link" href="/scrape-form"><i class="fas fa-server"></i> <span>Load Data Absen DCAP</span></a>
                <a class="nav-link" href="/pegawai"><i class="fas fa-users"></i> <span>Data Pegawai</span></a>
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-cogs"></i> <span>Pengaturan</span>
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="/edit_shift_mappings">Mapping Jadwal Shift</a></li>
                        <li><a class="dropdown-item" href="/edit-nip-mapping">Mapping NIP (Old)</a></li>
                        <li><a class="dropdown-item" href="/edit_connection">Pengaturan Database</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="flex-grow-1">

            <nav class="navbar navbar-expand-lg navbar-custom">
                <div class="container-fluid">
                    <span>Edit Shift Mappings</span>
                    <div class="ms-auto"></div>
                </div>
            </nav>

            <div class="content">
                <div class="container mt-5">
                    <h1 class="text-center mb-4">Edit Shift Mapping</h1>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="shift_name" class="form-label">Nama Shift</label>
                            <select id="shift_name" name="shift_name" class="form-select" required>
                                <option value="">Pilih Shift</option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nips" class="form-label">NIP:</label>
                            <div id="nips-container"></div>
                            <button type="button" class="btn btn-outline-primary" onclick="addNipField()">Add NIP</button>
                        </div>

                        <div class="mb-3">
                            <label for="shift_mapping" class="form-label">Shift Mapping:</label>
                            <div id="shift-mapping-container"></div>
                            <button type="button" class="btn btn-outline-primary" onclick="addShiftMappingField()">Add Shift Mapping</button>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
