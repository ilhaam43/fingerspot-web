<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Edit Pegawai - APBI</title>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                content.classList.remove('lg:ml-56');
            } else {
                content.classList.add('lg:ml-56');
            }
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('settings-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function toggleModal(show, modalId) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

 document.addEventListener('DOMContentLoaded', () => {
    const scrollableElement = document.querySelector('.relative.overflow-y-auto'); 
    const editButtons = document.querySelectorAll('.edit-button'); 

    const savedScrollPosition = localStorage.getItem('scrollableElementScrollPosition');
    const highlightedRowIds = JSON.parse(localStorage.getItem('highlightedRowIds')) || []; 

    if (savedScrollPosition) {
        scrollableElement.scrollTop = parseInt(savedScrollPosition, 10);
        localStorage.removeItem('scrollableElementScrollPosition'); 
    }

    highlightedRowIds.forEach(rowId => {
        const row = document.querySelector(`tr[data-row-id="${rowId}"]`);
        if (row) {
            row.style.backgroundColor = '#f0f4ff'; 
        }
    });

    editButtons.forEach(button => {
        button.addEventListener('click', (e) => {
            e.preventDefault(); 

            const row = button.closest('tr'); 
            row.style.backgroundColor = '#f0f4ff'; 

            const rowId = row.getAttribute('data-row-id');
            if (!highlightedRowIds.includes(rowId)) {
                highlightedRowIds.push(rowId); 
                localStorage.setItem('highlightedRowIds', JSON.stringify(highlightedRowIds)); 
            }

            localStorage.setItem('scrollableElementScrollPosition', scrollableElement.scrollTop); 

            setTimeout(() => {
                window.location.href = button.href;
            }, 200);
        });
    });
});

    </script>
    <style>
                                .scrollbar-hidden {
                            scrollbar-width: none;
                            -ms-overflow-style: none; 
                        }
                        .scrollbar-hidden::-webkit-scrollbar {
                            display: none; 
                        }

    </style>
</head>
<body class="bg-gray-100">
    <div class="relative flex min-h-screen">

        <div id="sidebar" class="w-56 bg-white text-gray-800 flex flex-col p-4 fixed h-full z-40 shadow-lg border-r border-gray-200">

            <button onclick="toggleSidebar()" class="absolute top-4 right-4 text-gray-800 text-xl lg:hidden">
                <i class="fas fa-times"></i>
            </button>

            <div class="flex items-center justify-center mb-8">
                <img src="https://www.lintasarta.net/storage/2024/06/Logo-Lintasarta-new.png" alt="Logo" class="h-auto object-contain max-w-[150px]">
            </div>

            <nav class="space-y-6">
                <ul class="space-y-2">
                
                    <li>
                        <a href="/" class="group flex items-center p-3 rounded-xl hover:bg-blue-100 text-gray-800 shadow-md transition duration-300">
                            <i class="fas fa-calendar-check mr-4 text-blue-500 text-lg"></i>
                            <span class="font-semibold text-sm">Data Absen</span>
                        </a>
                    </li>
            
                  
                    <li>
                        <a href="/upload_excel" class="group flex items-center p-3 rounded-xl hover:bg-green-100 text-gray-800 shadow-md transition duration-300">
                            <i class="fas fa-calendar-alt mr-4 text-green-600 text-lg"></i>
                            <span class="font-semibold text-sm">Upload Jadwal Shift</span>
                        </a>
                    </li>
            
                   
                    <li>
                        <a href="/upload" class="group flex items-center p-3 rounded-xl hover:bg-yellow-100 text-gray-800 shadow-md transition duration-300">
                            <i class="fas fa-history mr-4 text-yellow-500 text-lg"></i>
                            <span class="font-semibold text-sm">Load Data Absen (Mesin Lama)</span>
                        </a>
                    </li>
            
              
                    <li>
                        <a href="/att_log" class="group flex items-center p-3 rounded-xl hover:bg-purple-100 text-gray-800 shadow-md transition duration-300">
                            <i class="fas fa-fingerprint mr-4 text-purple-600 text-lg"></i>
                            <span class="font-semibold text-sm">Load Data Absen Fingerspot</span>
                        </a>
                    </li>
            
                 
                    <li>
                        <div>
                            <button onclick="toggleDropdown()" class="group flex items-center p-3 rounded-xl hover:bg-pink-100 text-gray-800 shadow-md transition duration-300 w-full text-left">
                                <i class="fas fa-ellipsis-h mr-4 text-pink-500 text-lg"></i>
                                <span class="font-semibold text-sm">Lainnya</span>
                                <i class="fas fa-chevron-down ml-auto text-gray-400 group-hover:text-pink-500"></i>
                            </button>
                            <ul id="settings-dropdown" class="pl-8 mt-3 space-y-2 hidden">
                                <li>
                                    <a href="/pegawai" class="block text-sm font-medium text-gray-700 hover:text-blue-500">
                                        <i class="fas fa-users mr-2 text-blue-500"></i> Pegawai
                                    </a>
                                </li>
                                <li>
                                    <a href="/upload-lembur" class="block text-sm font-medium text-gray-700 hover:text-blue-500">
                                        <i class="fas fa-business-time mr-2 text-green-600"></i> Lemburan
                                    </a>
                                </li>
                                <li>
                                    <a href="/ito_load" class="block text-sm font-medium text-gray-700 hover:text-blue-500">
                                        <i class="fas fa-mobile-alt mr-2 text-indigo-500"></i>&nbsp;&nbsp; Absen ITO
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </nav>

            <div class="mt-auto text-center text-sm text-gray-500 border-t border-gray-300 pt-4">
                <a href="/logout">
                    <i class="fas fa-sign-out text-lg"></i>
                    <span class="hidden md:inline font-medium text-sm">Logout</span>
                </a>
            </div>
        </div>

        <div id="content" class="flex-1 flex flex-col lg:ml-56">

<div class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-30 border-b border-gray-200">

    <button onclick="toggleSidebar()" class="text-gray-600 bg-gray-100 px-4 py-2 rounded-full hover:bg-gray-200 transition-all flex items-center space-x-2">
        <i class="fas fa-bars text-lg"></i>
        <span class="hidden md:inline font-medium text-sm">Menu</span>
    </button>

    <div class="flex items-center space-x-3">

    </div>
</div>

<div class="flex-grow flex items-center justify-center p-4 bg-gray-50">
    <div class="w-full max-w-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Edit Data Pegawai</h1>
            <p class="text-gray-500 mt-2">Perbarui detail untuk <span class="font-semibold text-blue-600">{{ pegawai['pegawai_nama'] }}</span>.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
            <form action="{{ url_for('edit_pegawai', pegawai_id=pegawai['pegawai_id']) }}" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="pegawai_pin" class="block text-sm font-semibold text-gray-700 mb-1">PIN</label>
                        <input type="text" id="pegawai_pin" name="pegawai_pin" value="{{ pegawai['pegawai_pin'] }}" required
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label for="pegawai_nip" class="block text-sm font-semibold text-gray-700 mb-1">NIP</label>
                        <input type="text" id="pegawai_nip" name="pegawai_nip" value="{{ pegawai['pegawai_nip'] }}"
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                </div>

                <div>
                    <label for="pegawai_nama" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="pegawai_nama" name="pegawai_nama" value="{{ pegawai['pegawai_nama'] }}" required
                        class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="pegawai_alias" class="block text-sm font-semibold text-gray-700 mb-1">Alias (Opsional)</label>
                        <input type="text" id="pegawai_alias" name="pegawai_alias" value="{{ pegawai['pegawai_alias'] }}"
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label for="pegawai_nik_lintas" class="block text-sm font-semibold text-gray-700 mb-1">NIK Lintasarta</label>
                        <input type="text" id="pegawai_nik_lintas" name="pegawai_nik_lintas" value="{{ pegawai['pegawai_nik_lintas'] }}"
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="pembagian1_id" class="block text-sm font-semibold text-gray-700 mb-1">Divisi</label>
                        <select id="pembagian1_id" name="pembagian1_id" required
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">-- Pilih Divisi --</option>
                            {% for pembagian in pembagian1 %}
                            <option value="{{ pembagian.pembagian1_id }}" {% if pembagian.pembagian1_id == pegawai['pembagian1_id'] %}selected{% endif %}>
                                {{ pembagian.pembagian1_nama }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="pembagian2_id" class="block text-sm font-semibold text-gray-700 mb-1">Fungsi</label>
                        <select id="pembagian2_id" name="pembagian2_id" required
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">-- Pilih Fungsi --</option>
                            {% for pembagian in pembagian2 %}
                            <option value="{{ pembagian.pembagian2_id }}" {% if pembagian.pembagian2_id == pegawai['pembagian2_id'] %}selected{% endif %}>
                                {{ pembagian.pembagian2_nama }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="pembagian3_id" class="block text-sm font-semibold text-gray-700 mb-1">Tim</label>
                        <select id="pembagian3_id" name="pembagian3_id"
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">-- Pilih Tim --</option>
                            {% for tim in pembagian3 %}
                            <option value="{{ tim.pembagian3_id }}" {% if pegawai and pegawai.pembagian3_id == tim.pembagian3_id %}selected{% endif %}>
                                {{ tim.pembagian3_nama }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="sisa_cuti" class="block text-sm font-semibold text-gray-700 mb-1">Sisa Cuti (hari)</label>
                        <input type="number" id="sisa_cuti" name="sisa_cuti" value="{{ pegawai['sisa_cuti'] if pegawai['sisa_cuti'] is not none else 12 }}" min="0" max="365" required
                            class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                </div>

                <div>
                    <label for="pegawai_status" class="block text-sm font-semibold text-gray-700 mb-1">Status Pegawai</label>
                    <select id="pegawai_status" name="pegawai_status" required
                        class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="1" {% if pegawai['pegawai_status'] == 1 %}selected{% endif %}>Aktif</option>
                        <option value="0" {% if pegawai['pegawai_status'] == 0 %}selected{% endif %}>Tidak Aktif</option>
                        <option value="3" {% if pegawai['pegawai_status'] == 3 %}selected{% endif %}>Menunggu Reset</option>
                        <option value="4" {% if pegawai['pegawai_status'] == 4 %}selected{% endif %}>Menunggu Buat Password Baru</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-4 pt-4">
                    <a href="{{ url_for('index_pegawai') }}" class="px-6 py-2 text-sm font-semibold text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-all">
                        Batal
                    </a>
                    <button type="submit"
                        class="px-6 py-2 text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-500 rounded-lg hover:from-blue-700 hover:to-blue-600 shadow-md hover:shadow-lg transition-all">
                        <i class="fas fa-save mr-2"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
