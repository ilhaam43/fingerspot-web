    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                content.classList.remove('lg:ml-56');
            } else {
                content.classList.add('lg:ml-56');
            }
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('settings-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function toggleModal(show, modalId) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

 document.addEventListener('DOMContentLoaded', () => {
    const scrollableElement = document.querySelector('.relative.overflow-y-auto'); 
    const editButtons = document.querySelectorAll('.edit-button'); 

    const savedScrollPosition = localStorage.getItem('scrollableElementScrollPosition');
    const highlightedRowIds = JSON.parse(localStorage.getItem('highlightedRowIds')) || []; 

    if (savedScrollPosition) {
        scrollableElement.scrollTop = parseInt(savedScrollPosition, 10);
        localStorage.removeItem('scrollableElementScrollPosition'); 
    }

    highlightedRowIds.forEach(rowId => {
        const row = document.querySelector(`tr[data-row-id="${rowId}"]`);
        if (row) {
            row.style.backgroundColor = '#f0f4ff'; 
        }
    });

    editButtons.forEach(button => {
        button.addEventListener('click', (e) => {
            e.preventDefault(); 

            const row = button.closest('tr'); 
            row.style.backgroundColor = '#f0f4ff'; 

            const rowId = row.getAttribute('data-row-id');
            if (!highlightedRowIds.includes(rowId)) {
                highlightedRowIds.push(rowId); 
                localStorage.setItem('highlightedRowIds', JSON.stringify(highlightedRowIds)); 
            }

            localStorage.setItem('scrollableElementScrollPosition', scrollableElement.scrollTop); 

            setTimeout(() => {
                window.location.href = button.href;
            }, 200);
        });
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const monthPicker = document.getElementById('monthPicker');
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0'); // bulan mulai dari 0
    monthPicker.value = `${year}-${month}`;
});

function prepareStartDate() {
    const monthPicker = document.getElementById('monthPicker');
    const startDateInput = document.getElementById('startDate');

    const [year, month] = monthPicker.value.split('-');
    startDateInput.value = `${year}-${month}-01`;

    return true; // lanjutkan submit
}



    </script>
    <style>

<div class="flex-grow flex items-center justify-center p-4 bg-white">
    <div class="w-full max-w-xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Upload Jadwal Shift</h1>
            <p class="text-gray-500 mt-2">Silakan isi form di bawah untuk memperbarui jadwal shift pegawai.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6" onsubmit="return prepareStartDate()">
            <div>
                <label for="monthPicker" class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-calendar-alt mr-2 text-blue-500"></i>Pilih Bulan Jadwal
                </label>
                <div class="relative">
                    <input
                        type="month"
                        id="monthPicker"
                        name="monthPicker"
                        required
                        class="block w-full rounded-lg border-gray-300 shadow-sm pl-4 pr-4 py-3 focus:ring-blue-500 focus:border-blue-500 text-base"
                    >
                </div>
            </div>
        
            <input type="hidden" id="startDate" name="startDate">

            <div>
                <label for="division" class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-building mr-2 text-green-500"></i>Pilih Divisi
                </label>
                <select name="division" id="division" required
                class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-lg shadow-sm
                       focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            
                <option value="" disabled selected>Pilih Divisi</option>
            
                <!-- Semua divisi (opsional kalau dipakai untuk filter) -->
                <option value="ALL">Semua Divisi</option>
            
                <!-- Divisi tunggal -->
                <option value="HDTI">HDTI</option>
                <option value="HDBS">HDBS</option>
                <option value="QAQC">QAQC</option>
                <option value="TA">TA</option>
            
                <!-- Divisi gabungan -->
                <option value="HDTI-HDBS">HDTI - HDBS</option>
                <option value="QAQC-TA">QAQC - TA</option>
            </select>
            
            </div>
        
            <div>
                <label for="file" class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-file-excel mr-2 text-purple-500"></i>Pilih File Excel
                </label>
                <input
                    type="file"
                    id="file"
                    name="file"
                    accept=".xlsx,.xls"
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition"
                >
            </div>

                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:shadow-lg hover:from-blue-700 hover:to-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 transition-all duration-300 flex items-center justify-center text-base"
