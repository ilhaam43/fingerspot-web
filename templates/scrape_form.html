<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <title>Absen</title>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                content.classList.remove('lg:ml-56');
            } else {
                content.classList.add('lg:ml-56');
            }
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('settings-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function toggleModal(show, modalId) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

 document.addEventListener('DOMContentLoaded', () => {
    const scrollableElement = document.querySelector('.relative.overflow-y-auto'); 
    const editButtons = document.querySelectorAll('.edit-button'); 

    const savedScrollPosition = localStorage.getItem('scrollableElementScrollPosition');
    const highlightedRowIds = JSON.parse(localStorage.getItem('highlightedRowIds')) || []; 

    if (savedScrollPosition) {
        scrollableElement.scrollTop = parseInt(savedScrollPosition, 10);
        localStorage.removeItem('scrollableElementScrollPosition'); 
    }

    highlightedRowIds.forEach(rowId => {
        const row = document.querySelector(`tr[data-row-id="${rowId}"]`);
        if (row) {
            row.style.backgroundColor = '#f0f4ff'; 
        }
    });

    editButtons.forEach(button => {
        button.addEventListener('click', (e) => {
            e.preventDefault(); 

            const row = button.closest('tr'); 
            row.style.backgroundColor = '#f0f4ff'; 

            const rowId = row.getAttribute('data-row-id');
            if (!highlightedRowIds.includes(rowId)) {
                highlightedRowIds.push(rowId); 
                localStorage.setItem('highlightedRowIds', JSON.stringify(highlightedRowIds)); 
            }

            localStorage.setItem('scrollableElementScrollPosition', scrollableElement.scrollTop); 

            setTimeout(() => {
                window.location.href = button.href;
            }, 200);
        });
    });
});

    </script>
    <style>
                                .scrollbar-hidden {
                            scrollbar-width: none;
                            -ms-overflow-style: none;
                        }
                        .scrollbar-hidden::-webkit-scrollbar {
                            display: none;
                        }

    </style>
</head>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
<script>
    $(document).ready(function() {
        $('#date_range').daterangepicker({
            locale: {
                format: 'DD/MM/YYYY'
            },
            maxSpan: {
                days: 6
            },
            showDropdowns: true,
            opens: 'right',
            alwaysShowCalendars: true,
            autoApply: true
        });
    });
</script>
