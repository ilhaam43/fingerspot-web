<html>
<head>
    <title>Cek Absenku  - APBI/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        body {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            background-size: 400% 400%;
            animation: gradientAnimation 5s ease infinite;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-title {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: #343a40;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-custom {
            background-color: #0056b3;
            color: #ffffff;
            border-radius: 50px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .btn-custom:hover {
            background-color: #003d80;
            color: #ffffff;
            transform: scale(1.05);
        }
        .logo {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="form-container text-center">
                    <img src="https://www.lintasarta.net/storage/2024/06/Logo-Lintasarta-new.png" alt="Company Logo" class="logo mb-4">
                    <h1 class="form-title mb-4">Lihat Absenku</h1>
                    <form method="POST" action="/search_month">
                        <div class="mb-3 text-start">
                            <label for="search_name" class="form-label">Masukin Nama:</label>
                            <input type="text" class="form-control" id="search_name" name="search_name" placeholder="Masukkan nama pegawai" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label for="month" class="form-label">Pilih Bulan:</label>
                            <input type="month" class="form-control" id="month" name="month" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-custom">Submit</button>
                        </div>
                        <i>*Mungkin Data Absen Kamu Belum Update</i>
                        <br/>
                        <i>*Last Updated: 01-09-2024 - 24-09-2024</i>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $("#search_name").autocomplete({
                source: function(request, response) {
                    $.ajax({
                        url: "/search_name_autocomplete",
                        data: {
                            term: request.term 
                        },
                        success: function(data) {
                            response(data);
                        }
                    });
                },
                minLength: 2
            });
        });
    </script>
</body>
</html>
