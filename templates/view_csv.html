<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Hasil Upload Data Absen - APBI</title>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                content.classList.remove('lg:ml-56');
            } else {
                content.classList.add('lg:ml-56');
            }
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('settings-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function toggleModal(show, modalId) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

 document.addEventListener('DOMContentLoaded', () => {
    const scrollableElement = document.querySelector('.relative.overflow-y-auto'); 
    const editButtons = document.querySelectorAll('.edit-button'); 

    const savedScrollPosition = localStorage.getItem('scrollableElementScrollPosition');
    const highlightedRowIds = JSON.parse(localStorage.getItem('highlightedRowIds')) || []; 

    if (savedScrollPosition) {
        scrollableElement.scrollTop = parseInt(savedScrollPosition, 10);
        localStorage.removeItem('scrollableElementScrollPosition'); 
    }

    highlightedRowIds.forEach(rowId => {
        const row = document.querySelector(`tr[data-row-id="${rowId}"]`);
        if (row) {
            row.style.backgroundColor = '#f0f4ff'; 
        }
    });

    editButtons.forEach(button => {
        button.addEventListener('click', (e) => {
            e.preventDefault(); 

            const row = button.closest('tr'); 
            row.style.backgroundColor = '#f0f4ff'; 

            const rowId = row.getAttribute('data-row-id');
            if (!highlightedRowIds.includes(rowId)) {
                highlightedRowIds.push(rowId); 
                localStorage.setItem('highlightedRowIds', JSON.stringify(highlightedRowIds)); 
            }

            localStorage.setItem('scrollableElementScrollPosition', scrollableElement.scrollTop); 

            setTimeout(() => {
                window.location.href = button.href;
            }, 200);
        });
    });
});

    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        /* Styling for the injected table */
        .injected-table table { width: 100%; border-collapse: collapse; font-size: 0.875rem; color: #4b5563; }
        .injected-table thead { background: linear-gradient(to right, #2563eb, #3b82f6); color: white; position: sticky; top: 0; z-index: 10; }
        .injected-table th { padding: 0.75rem 1rem; text-align: left; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .injected-table tbody { background-color: white; divide-y: divide-gray-200; }
        .injected-table tr:hover { background-color: #eff6ff; transition: background-color 0.2s; }
        .injected-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
    </style>

</head>
<body class="bg-gray-100">

                                    </a>

                    </li>
                </ul>
            </nav>

            <div class="mt-auto text-center text-sm text-gray-500 border-t border-gray-300 pt-4">
                <a href="/logout">
                    <i class="fas fa-sign-out text-lg"></i>
                    <span class="hidden md:inline font-medium text-sm">Logout</span>
                </a>
            </div>
        </div>

        <div id="content" class="flex-1 flex flex-col lg:ml-56">

<div class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-30 border-b border-gray-200">

    <button onclick="toggleSidebar()" class="text-gray-600 bg-gray-100 px-4 py-2 rounded-full hover:bg-gray-200 transition-all flex items-center space-x-2">
        <i class="fas fa-bars text-lg"></i>

    <div class="flex items-center space-x-3">

    </div>
</div>

<div class="flex-grow p-4 md:p-6 flex flex-col">
    <div class="bg-gradient-to-br from-white to-gray-50 shadow-xl rounded-2xl p-6 md:p-8 flex flex-col flex-grow">

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
            <div>
                <h3 class="text-2xl md:text-3xl font-bold text-gray-800">Hasil Upload Data Absen</h3>
                <p class="text-sm text-gray-500 mt-1">File: <span class="font-medium text-blue-600">{{ filename }}</span></p>
            </div>
        </div>

        <div class="flex-grow rounded-lg border border-gray-200 shadow-inner bg-white overflow-hidden relative custom-scrollbar">
            <div class="absolute inset-0 overflow-auto custom-scrollbar injected-table">
                {{ tables|safe }}
            </div>
        </div>

    </div>
</div>

</body>
</html>
