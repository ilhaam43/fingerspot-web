    <style>
          body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .sidebar {
            background-color: white;
            color: black;
            padding: 20px;
            max-width: 200px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-right: 1px solid #ddd;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
        }
        .sidebar img {
            display: block;
            margin: -15px auto 20px auto;
            height: 60px;
        }
        .sidebar .nav-link {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        .sidebar .nav-link span {
            display: inline-block;
            vertical-align: middle;
        }
        .sidebar .nav-link:hover {
            background-color: #007aff;
            color: white;
        }
        .navbar-custom {
            background-color: #007aff;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: white;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 200px;
            right: 0;
            z-index: 1000;
            height: 58px;
        }
        .content {
            padding: 20px;
            flex-grow: 1;
            margin-left: 200px;
            margin-top: 60px;
        }
        
        h1 {
            margin-bottom: 20px;
            font-weight: bold;
            color: #343a40;
        }
        .table-responsive {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        background-color: white;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 20px;
        background-color: white;
        font-family: "Roboto", sans-serif;
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #007aff;
        color: white;
        font-weight: 600;
        font-size: 15px;
        text-transform: uppercase;
        border-top: 1px solid #ddd;
    }

    td {
        font-size: 14px;
        color: #555;
    }

    tr:nth-child(even) {
        background-color: #f7f7f7;
    }

    tr:hover {
        background-color: #e9f3ff;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
        .btn-primary {
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 16px;
            margin-bottom: 20px;
            background-color: #007aff;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .table-container {
            margin: 0 auto;
            max-width: auto;
        }

        .action-buttons a {
            text-decoration: none;
            font-size: 14px;
            color: #007aff;
            margin-right: 10px;
            transition: color 0.3s;
        }

        .action-buttons form {
            display: inline;
        }

        .action-buttons button {
            border: none;
            background: none;
            color: #ff6b6b;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .action-buttons a:hover {
            color: #0056b3;
        }

        .action-buttons button:hover {
            color: #ff3333;
        }

    </style>
</head>
