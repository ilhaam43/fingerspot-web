<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Apply Rules DCAP</title>
    <style>
        table.dataframe {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1rem;
        }
        table.dataframe th, table.dataframe td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            text-align: left;
            font-size: 0.875rem;
        }
        table.dataframe th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        table.dataframe tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .highlight-col {
            background-color: #ebf4ff !important;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 mt-8">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Review Aturan Shift DCAP</h1>
                    <p class="text-gray-500 text-sm">File: {{ filename }} (Kolom Scan In/Out Final ditambahkan dari DB)</p>
                </div>
                <div class="space-x-4 flex items-center">
                    <a href="{{ url_for('convert_dcap', filename=filename) }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded shadow transition">
                        <i class="fas fa-arrow-left mr-2"></i>Kembali
                    </a>
                    <form action="{{ url_for('save_dcap', filename=filename) }}" method="POST" class="inline flex items-center space-x-4">
                        <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" name="include_empty_lokasi" id="toggleEmptyLokasi" value="yes" checked class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                            <span>Sertakan "Lokasi Masuk" Kosong</span>
                        </label>
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition flex items-center">
                            <i class="fas fa-database mr-2"></i>Update to DB
                        </button>
                    </form>
                </div>
            </div>

            <div class="overflow-x-auto">
                <!-- HTML Table generated by Pandas -->
                {{ tables | safe }}
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const table = document.querySelector(".dataframe");
            if(table) {
                const headers = Array.from(table.querySelectorAll("th")).map(th => th.innerText.trim());
                const lokasiIndex = headers.indexOf("Lokasi Masuk");
                const nipIndex = headers.indexOf("NIP");
                const khususNips = ["1360", "1359", "2350", "2355", "1316"];
                const emptyRows = [];
                
                if(lokasiIndex !== -1) {
                    const rows = Array.from(table.querySelectorAll("tbody tr"));
                    rows.forEach(row => {
                        const cells = row.querySelectorAll("td");
                        if(cells.length > lokasiIndex) {
                            const cellText = cells[lokasiIndex].innerText.trim();
                            let nipVal = "";
                            if(nipIndex !== -1 && cells.length > nipIndex) {
                                nipVal = cells[nipIndex].innerText.trim();
                            }
                            
                            if(cellText === "" || cellText.toLowerCase() === "nan") {
                                if (khususNips.includes(nipVal)) {
                                    row.style.backgroundColor = "#bfdbfe"; // Tailwind blue-200 (biru muda)
                                } else {
                                    row.style.backgroundColor = "#fef08a"; // Tailwind yellow-200
                                    emptyRows.push(row);
                                }
                            }
                        }
                    });
                }

                const checkbox = document.getElementById("toggleEmptyLokasi");
                if(checkbox) {
                    checkbox.addEventListener("change", function() {
                        const isChecked = this.checked;
                        emptyRows.forEach(row => {
                            row.style.display = isChecked ? "" : "none";
                        });
                    });
                }
            }
        });
    </script>
</body>
</html>
