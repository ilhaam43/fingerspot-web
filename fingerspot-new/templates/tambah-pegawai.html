<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pegawai — Lintasarta APBI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: {
                        primary: { 50:'#ecfeff',100:'#cffafe',500:'#06b6d4',600:'#0891b2',700:'#0e7490' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .form-input {
            width: 100%; height: 44px; padding: 0 14px;
            border: 1.5px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; outline: none; background: #f8fafc;
            color: #0f172a; transition: border 0.15s, box-shadow 0.15s; font-weight: 500;
        }
        .form-input::placeholder { color: #94a3b8; font-weight: 400; }
        .form-input:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); background: white; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-label .required { color: #ef4444; margin-left: 2px; font-size: 14px; }
        
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 12px; pointer-events: none;
        }
        .form-input.is-select { appearance: none; padding-right: 36px; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen w-full">

        {% include 'components/sidebar.html' %}

        <div id="content" class="flex-1 flex flex-col transition-all duration-300 lg:ml-[260px] w-full h-full overflow-hidden">
            {% include 'components/topbar.html' %}

            <div class="flex-1 p-4 md:p-6 overflow-y-auto">
                <div class="max-w-3xl mx-auto pb-10">

                    <!-- Header -->
                    <div class="mb-6">
                        <a href="{{ url_for('pegawai.data_pegawai') }}" class="inline-flex items-center text-sm font-semibold text-gray-500 hover:text-cyan-600 transition-colors mb-4">
                            <i class="fas fa-arrow-left mr-2"></i> Kembali ke Data Pegawai
                        </a>
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-cyan-500 text-white flex items-center justify-center shrink-0 shadow-sm shadow-cyan-100">
                                <i class="fas fa-user-plus text-xl"></i>
                            </div>
                            <div>
                                <h1 class="text-2xl font-bold text-gray-900">Tambah Pegawai Baru</h1>
                                <p class="text-sm text-gray-500 mt-1">Daftarkan data identitas dan divisi pegawai ke dalam sistem.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Form Card -->
                    <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden" style="box-shadow: 0 4px 24px rgba(0,0,0,0.04);">
                        
                        <div class="px-6 py-4 bg-slate-50/50 border-b border-gray-100">
                            <h2 class="text-sm font-bold text-gray-700"><i class="fas fa-id-card text-cyan-500 mr-2"></i>Informasi Identitas</h2>
                        </div>

                        <form action="{{ url_for('pegawai.tambah_pegawai') }}" method="POST">
                            <div class="p-6 space-y-6">
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label for="pegawai_pin" class="form-label">PIN <span class="required">*</span></label>
                                        <input type="text" id="pegawai_pin" name="pegawai_pin" placeholder="Contoh: 1234 (4 Digit NIP)" required class="form-input">
                                    </div>
                                    <div>
                                        <label for="pegawai_nip" class="form-label">NIP Lintasarta</label>
                                        <input type="text" id="pegawai_nip" name="pegawai_nip" placeholder="Nomor Induk Pegawai" class="form-input">
                                    </div>
                                </div>

                                <div>
                                    <label for="pegawai_nama" class="form-label">Nama Lengkap <span class="required">*</span></label>
                                    <input type="text" id="pegawai_nama" name="pegawai_nama" placeholder="Nama Lengkap Sesuai KTP" required class="form-input">
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label for="pegawai_alias" class="form-label">Alias / Panggilan</label>
                                        <input type="text" id="pegawai_alias" name="pegawai_alias" placeholder="Nama Panggilan (Opsional)" class="form-input">
                                    </div>
                                    <div>
                                        <label for="pegawai_nik_lintas" class="form-label">NIK Kependudukan</label>
                                        <input type="text" id="pegawai_nik_lintas" name="pegawai_nik_lintas" placeholder="Nomor Induk Kependudukan" class="form-input">
                                    </div>
                                </div>

                                <div class="h-px bg-gray-100 my-2"></div>
                                <h2 class="text-sm font-bold text-gray-700 -mt-2 mb-2"><i class="fas fa-building text-cyan-500 mr-2"></i>Penempatan & Organisasi</h2>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label for="pembagian1_id" class="form-label">Divisi <span class="required">*</span></label>
                                        <div class="select-wrapper">
                                            <select id="pembagian1_id" name="pembagian1_id" required class="form-input is-select">
                                                <option value="" disabled selected>-- Pilih Divisi --</option>
                                                {% for pembagian in pembagian1 %}
                                                <option value="{{ pembagian.pembagian1_id }}">{{ pembagian.pembagian1_nama }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label for="pembagian2_id" class="form-label">Fungsi / Jabatan <span class="required">*</span></label>
                                        <div class="select-wrapper">
                                            <select id="pembagian2_id" name="pembagian2_id" required class="form-input is-select">
                                                <option value="" disabled selected>-- Pilih Fungsi --</option>
                                                {% for pembagian in pembagian2 %}
                                                <option value="{{ pembagian.pembagian2_id }}">{{ pembagian.pembagian2_nama }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label for="pembagian3_id" class="form-label">Tim Sub-Divisi</label>
                                        <div class="select-wrapper">
                                            <select id="pembagian3_id" name="pembagian3_id" class="form-input is-select">
                                                <option value="" selected>-- Pilih Tim (Opsional) --</option>
                                                {% for tim in pembagian3 %}
                                                <option value="{{ tim.pembagian3_id }}">{{ tim.pembagian3_nama }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label for="sisa_cuti" class="form-label">Sisa Cuti Awal (Hari) <span class="required">*</span></label>
                                        <input type="number" id="sisa_cuti" name="sisa_cuti" value="12" min="0" max="365" required class="form-input font-mono">
                                    </div>
                                </div>

                            </div>

                            <!-- Footer Actions -->
                            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-end gap-3 rounded-b-2xl">
                                <a href="{{ url_for('pegawai.data_pegawai') }}" class="px-5 py-2.5 text-sm font-bold text-gray-600 bg-white border border-gray-200 rounded-xl hover:bg-gray-100 hover:text-gray-900 transition-colors shadow-sm">
                                    Batal
                                </a>
                                <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-cyan-600 rounded-xl hover:bg-cyan-700 shadow-sm hover:shadow-md transition-all flex items-center gap-2">
                                    <i class="fas fa-check"></i> Simpan Pegawai
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
